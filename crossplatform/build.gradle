plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk 35

    defaultConfig {
        minSdk 21
        targetSdk 35

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    namespace 'com.adapty.internal.crossplatform'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
        // Keep pre-2.2 interface ABI (DefaultImpls only, no JVM default methods)
        jvmDefault = org.jetbrains.kotlin.gradle.dsl.JvmDefaultMode.DISABLE
        freeCompilerArgs.add('-opt-in=com.adapty.ui.internal.platform.InternalAdaptyUiApi')
    }
}

dependencies {
    compileOnly project(':adapty')
    compileOnly project(':adapty-ui')
    compileOnly 'androidx.compose.ui:ui:1.8.0'
    compileOnly 'com.google.code.gson:gson:2.11.0'
    compileOnly 'com.android.billingclient:billing:8.0.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.8.2'
    testImplementation 'junit:junit:4.13.2'
}
