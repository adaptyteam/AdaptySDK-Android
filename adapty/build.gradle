apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
android {
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 30

        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    namespace 'com.adapty'
    buildFeatures {
        buildConfig true
    }
}

kotlin {
    // Strict explicit API for main sources only (-Xexplicit-api=strict is not passed to tests)
    explicitApi()
    compilerOptions {
        freeCompilerArgs.add('-opt-in=kotlin.RequiresOptIn')
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
        // Keep pre-2.2 interface ABI (DefaultImpls only, no JVM default methods)
        jvmDefault = org.jetbrains.kotlin.gradle.dsl.JvmDefaultMode.DISABLE
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.13.2'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${kotlin_version}"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    api 'com.android.billingclient:billing:8.0.0'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'
    implementation 'com.google.android.gms:play-services-appset:16.0.2'
    implementation 'androidx.lifecycle:lifecycle-process:2.4.0'
    implementation "com.android.installreferrer:installreferrer:2.2"
    implementation 'androidx.browser:browser:1.5.0'
}
