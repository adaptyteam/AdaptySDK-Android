plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    compileSdk 31

    defaultConfig {
        minSdk 21
        targetSdk 31

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        compose = true
    }
    namespace 'com.adapty.ui'
}

kotlin {
    // Strict explicit API for main sources only (-Xexplicit-api=strict is not passed to tests)
    explicitApi()
    compilerOptions {
        freeCompilerArgs.add('-opt-in=kotlin.RequiresOptIn')
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
        // Keep pre-2.2 interface ABI (DefaultImpls only, no JVM default methods)
        jvmDefault = org.jetbrains.kotlin.gradle.dsl.JvmDefaultMode.DISABLE
    }
}

// Pin the Kotlin module name for every variant (internal names are mangled with it)
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions.moduleName.set('adapty-ui_release')
}

composeCompiler {
    featureFlags.add(org.jetbrains.kotlin.compose.compiler.gradle.ComposeFeatureFlag.StrongSkipping.disabled())
}

def composeBom = '2025.04.01'

dependencies {

    compileOnly project(':adapty')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation platform("androidx.compose:compose-bom:$composeBom")
    api 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.0'
    implementation 'androidx.javascriptengine:javascriptengine:1.0.0'
    implementation 'com.google.android.play:review:2.0.2'
    compileOnly 'com.google.code.gson:gson:2.11.0'

    debugCompileOnly 'androidx.compose.ui:ui-tooling'
    debugCompileOnly 'androidx.compose.ui:ui-test-manifest'
}