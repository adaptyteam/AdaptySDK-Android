plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    compileSdk 31

    defaultConfig {
        minSdk 21
        targetSdk 31

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        compose = true
    }
    namespace 'com.adapty.ui.video'
}

kotlin {
    // Strict explicit API for main sources only (-Xexplicit-api=strict is not passed to tests)
    explicitApi()
    compilerOptions {
        freeCompilerArgs.add('-opt-in=kotlin.RequiresOptIn')
        freeCompilerArgs.add('-opt-in=com.adapty.ui.internal.platform.InternalAdaptyUiApi')
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
        // Keep pre-2.2 interface ABI (DefaultImpls only, no JVM default methods)
        jvmDefault = org.jetbrains.kotlin.gradle.dsl.JvmDefaultMode.DISABLE
    }
}

composeCompiler {
    featureFlags.add(org.jetbrains.kotlin.compose.compiler.gradle.ComposeFeatureFlag.StrongSkipping.disabled())
}

def composeBom = '2025.04.01'

def exoplayerVersion = '1.4.1'

dependencies {

    compileOnly project(':adapty')
    compileOnly project(':adapty-ui')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation platform("androidx.compose:compose-bom:$composeBom")
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'

    debugCompileOnly 'androidx.compose.ui:ui-tooling'
    debugCompileOnly 'androidx.compose.ui:ui-test-manifest'

    implementation ("androidx.media3:media3-exoplayer:$exoplayerVersion")
    implementation ("androidx.media3:media3-exoplayer-hls:$exoplayerVersion")
    implementation ("androidx.media3:media3-ui:$exoplayerVersion")
    implementation ("androidx.media3:media3-common:$exoplayerVersion")

    implementation 'androidx.lifecycle:lifecycle-process:2.4.0'
}